<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1976d2">
  <title>نيبور سوق</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      width: 92%;
      max-width: 480px;
      background: white;
      border-radius: 20px;
      padding: 28px 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
      text-align: center;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 15px;
      border-radius: 22px;
      background: #1976d2;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
      font-weight: bold;
    }

    h1 {
      margin: 8px 0;
      font-size: 30px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    .choice {
      display: block;
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 16px;
      margin: 12px 0;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .customer {
      background: #1976d2;
      color: white;
    }

    .seller {
      background: #43a047;
      color: white;
    }

    .admin {
      background: #555;
      color: white;
    }

    .version {
      margin-top: 20px;
      color: #999;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="logo">ن</div>

    <h1>نيبور سوق</h1>

    <div class="subtitle">
      سوقك الإلكتروني في مكان واحد 🛍️
    </div>

    <button class="choice customer"
      onclick="location.href='index.html'">
      🛍️ دخول الزبون
    </button>

    <button class="choice seller"
      onclick="location.href='seller.html'">
      👨‍💼 دخول البائع
    </button>

    <button class="choice admin"
      onclick="location.href='admin.html'">
      🛠️ دخول الإدارة
    </button>

    <div class="version">
      نيبور سوق — الإصدار التجريبي
    </div>

  </div>

</body>
</html>
